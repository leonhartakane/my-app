<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Текст 1</title>
    <link rel="stylesheet" href="style.css?v=10">
</head>

<body>
    <div class="app">

        <header class="header">
            <button class="back" id="backBtn" aria-label="Назад">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5">
                    <polyline points="16,3 7,12 16,21" />
                </svg>
            </button>
            <h1>Удостоверение личности</h1>
        </header>

        <div class="tabs-wrap">
            <div class="tabs">
                <button class="tab active">Документ</button>
                <button class="tab">Реквизиты</button>
            </div>
        </div>

        <main class="content">

            <!-- Первая вкладка: фото -->
            <div class="panel" id="panel1">
                <label for="photoInput" id="photoAdd" class="photo-add">
                    <svg class="icon big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
                        <circle cx="12" cy="13" r="3" />
                    </svg>
                    <span>Добавить фото</span>
                </label>
                <input type="file" id="photoInput" accept="image/*" hidden>

                <div class="photo-frame" id="photoFrame" hidden>
                    <img id="photo" alt="">
                </div>
            </div>

            <!-- Вторая вкладка -->
            <div class="panel" id="panel2" hidden></div>

        </main>

        <footer class="footer">
            <button class="btn btn-primary">
                <img src="white.png" class="icon" alt="">
                Предъявить документ
            </button>
            <button class="btn btn-outline">
                <img src="blue.png" class="icon" alt="">
                Отправить документ
            </button>
        </footer>

    </div>

    <script src="script.js?v=10"></script>
</body>
</html>
